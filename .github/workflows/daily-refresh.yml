name: daily-refresh

on:
  schedule:
    - cron: "0 4 * * *"        # 每天 04:00 UTC(约北京中午 12:00)刷新
  workflow_dispatch:
    inputs:
      games:
        description: "Optional space-separated games; empty = all"
        type: string
        default: ""
      probe_only:
        description: "Read-only authentication and free API quota check"
        type: boolean
        default: false

permissions:
  contents: write               # 允许提交更新后的 ratings.json

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache/restore@v4
        if: ${{ !inputs.probe_only }}
        with:
          path: games/*/data/
          key: esports-source-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: esports-source-v1-${{ runner.os }}-
      - name: Probe free Fixtures authentication and quota
        if: ${{ inputs.probe_only }}
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: python3 sources/pandascore.py
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Refresh all games' ratings
        if: ${{ !inputs.probe_only }}
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          SELECTED_GAMES: ${{ inputs.games }}
        run: |
          read -r -a games <<< "$SELECTED_GAMES"
          python3 refresh.py "${games[@]}"

      - name: Commit updated snapshots
        if: ${{ !cancelled() && !inputs.probe_only }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/*/ratings.json
          [ ! -f refresh-status.json ] || git add refresh-status.json
          [ ! -f source-coverage.json ] || git add source-coverage.json
          if git diff --cached --quiet; then
            echo "没有评级更新,跳过提交"
          else
            git commit -m "chore: daily ratings refresh [skip ci]"
            git push
          fi

      - name: Upload refresh diagnostics
        if: ${{ !cancelled() && !inputs.probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: refresh-status
          path: |
            refresh-status.json
            source-coverage.json
          if-no-files-found: ignore

      - name: Preserve complete source inputs for next daily increment
        if: ${{ !cancelled() && !inputs.probe_only }}
        uses: actions/cache/save@v4
        with:
          path: games/*/data/
          key: esports-source-v1-${{ runner.os }}-${{ github.run_id }}
